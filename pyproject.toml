[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exppilot"
version = "0.1.0"
description = "AI Experiment Copilot & Decision Intelligence — DTDL Talent Hack PS3"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ExpPilot Team" }]
keywords = ["experimentation", "ab-testing", "llm", "langgraph", "rag", "copilot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain>=0.3.14",
    "langchain-anthropic>=0.3.3",
    "langchain-core>=0.3.29",
    "numpy==2.2.1",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "mlflow==2.19.0",
    "streamlit==1.41.1",
    "httpx==0.28.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "build>=1.2"]
# --- synthgen accelerators (all optional; engine falls back without them) ---
# Differentiable stats via PyTorch autograd (CPU works; CUDA build enables GPU).
synthgen-diff = ["torch>=2.2"]
# Local Gemma 3n E4B generation via Hugging Face pipelines.
synthgen-local = ["transformers>=4.44", "accelerate>=0.33", "huggingface_hub>=0.24", "safetensors>=0.4"]
# Provider-agnostic API generation (Groq/OpenAI/Anthropic/Ollama) via LiteLLM.
synthgen-api = ["litellm>=1.44"]
# NVIDIA-GPU dataframe acceleration (requires CUDA 12 + NVIDIA GPU).
# Install from the RAPIDS index: pip install --extra-index-url=https://pypi.nvidia.com "cudf-cu12>=24.10" cupy-cuda12x
synthgen-gpu = ["cudf-cu12>=24.10", "cupy-cuda12x>=13.0"]

[project.urls]
Homepage = "https://github.com/AkikJana/ExpPilot"
Repository = "https://github.com/AkikJana/ExpPilot"

[project.scripts]
exppilot-seed = "data.seed:main"
exppilot-eval = "evals.harness:run"

[tool.setuptools]
packages = ["agents", "api", "data", "evals", "shared", "stats", "synthgen", "ui"]

[tool.setuptools.package-data]
"*" = ["*.md"]
